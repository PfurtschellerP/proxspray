# Configuration used when running playbooks from a checkout of this repository
# (`ansible-playbook -i inventory/<cluster>/inventory.ini setup.yml`).
#
# Like kubespray, the playbooks reference roles by their short name. From a
# checkout they are found through `roles_path` below; when the collection is
# installed (`ansible-playbook pfurtschellerp.proxspray.setup`) Ansible resolves
# them inside the collection, so the same playbooks work both ways.
#
# Relative paths in this file are resolved relative to this file.

[defaults]
roles_path = roles:$VIRTUAL_ENV/usr/local/share/proxspray/roles:$VIRTUAL_ENV/usr/local/share/ansible/roles:/usr/share/proxspray/roles

# Cache facts so that `--limit` runs still know about every cluster node
# (the hosts file, cluster join and Thunderbolt checks look at other nodes' facts).
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible/facts
fact_caching_timeout = 86400

interpreter_python = auto_silent
forks = 10
timeout = 60

# Readable output plus per-task timing.
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
display_skipped_hosts = false

retry_files_enabled = false

[inventory]
# Fetched files (e.g. the cluster CA) are written to <inventory>/artifacts;
# never try to parse them as inventory.
ignore_patterns = artifacts, credentials

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ServerAliveInterval=30 -o ConnectionAttempts=10
