# One Proxmox VE cluster per inventory. The first host creates the cluster.
#   node_id  selects the node's address on the Thunderbolt fabric (10.100.0.<node_id>)
#   node_ip  management address of the node (defaults to the default route's address)
[all]
node-1 ansible_host=10.10.1.6 node_id=1
node-2 ansible_host=10.10.1.7 node_id=2
node-3 ansible_host=10.10.1.8 node_id=3

[all:vars]
ansible_user=root
