---
- name: Get cluster options
  ansible.builtin.command: pvesh get /cluster/options --output-format json
  register: fabric_cluster_options
  changed_when: false
  check_mode: false
  run_once: true

# The migration option is returned either as property string or as object.
- name: Use the fabric network for migration
  vars:
    fabric_wanted: "network={{ fabric_ip_prefix }},type={{ fabric_migration_type }}"
    fabric_current: "{{ (fabric_cluster_options.stdout | from_json).migration | default('') }}"
    fabric_current_string: >-
      {{ fabric_current if fabric_current is string
         else fabric_current | dictsort | map('join', '=') | join(',') }}
  ansible.builtin.command:
    argv: [pvesh, set, /cluster/options, --migration, "{{ fabric_wanted }}"]
  changed_when: true
  run_once: true
  when: fabric_current_string.split(',') | sort != fabric_wanted.split(',') | sort
