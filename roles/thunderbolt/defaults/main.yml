---
# Thunderbolt network devices: interface name -> path of the Thunderbolt port
# (ID_PATH as shown by `udevadm info /sys/class/net/thunderbolt0 | grep ID_PATH`,
# the PCI address also shows up in `lspci | grep -i thunderbolt`).
# Interface names must be at most 15 characters. The fabric role uses these
# interfaces for the routed mesh.
thunderbolt_devices:
  en05:
    pci_path: "pci-0000:00:0d.2"
  en06:
    pci_path: "pci-0000:00:0d.3"

# MTU of the Thunderbolt interfaces (65520 is the maximum of thunderbolt-net).
thunderbolt_mtu: 65520

# Check at the end of the role that every interface exists and has a link.
thunderbolt_verify: true
# Seconds to wait for the interfaces to come up.
thunderbolt_verify_timeout: 60
# Minimum link speed in Gb/s per direction (speed per lane x lanes, as the
# kernel reports it for the connected host). Thunderbolt 4 host-to-host links
# bond two 20 Gb/s lanes to 40 Gb/s; a poor or non-Thunderbolt cable falls
# back to fewer lanes or a lower speed, which still works but slows Ceph.
# 0 disables the check, e.g. for kernels that report no link speed.
thunderbolt_min_link_speed: 40
