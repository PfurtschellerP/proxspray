---
# Loaded by systemd-modules-load from /etc/modules-load.d after the root
# filesystem is mounted, so the initramfs does not need them.
- name: Load Thunderbolt kernel modules now and on boot
  community.general.modprobe:
    name: "{{ thunderbolt_module }}"
    state: present
    persistent: present
  loop:
    - thunderbolt
    - thunderbolt-net
  loop_control:
    loop_var: thunderbolt_module

# .link files are applied by udev (net_setup_link), not by systemd-networkd.
- name: Create systemd link files for consistent interface naming
  ansible.builtin.template:
    src: thunderbolt.link.j2
    dest: "/etc/systemd/network/00-{{ thunderbolt_interface.key }}.link"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ thunderbolt_devices | dict2items }}"
  loop_control:
    loop_var: thunderbolt_interface
    label: "{{ thunderbolt_interface.key }}"
  notify:
    - Apply Thunderbolt link files
    - Update initramfs

- name: Find Thunderbolt link files
  ansible.builtin.find:
    paths: /etc/systemd/network
    patterns: "*.link"
    contains: "^Driver=thunderbolt-net$"
  register: thunderbolt_link_files

# Stale files for renamed interfaces would match the same port and win or
# conflict, depending on their sort order.
- name: Remove link files of interfaces no longer in thunderbolt_devices
  ansible.builtin.file:
    path: "{{ thunderbolt_link_file }}"
    state: absent
  loop: >-
    {{ thunderbolt_link_files.files | map(attribute='path')
       | difference(thunderbolt_devices.keys() | map('regex_replace', '^(.*)$', '/etc/systemd/network/00-\1.link')) }}
  loop_control:
    loop_var: thunderbolt_link_file
  notify:
    - Update initramfs
