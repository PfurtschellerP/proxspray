---
- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: true

- name: Add interface configuration for thunderbolt network devices
  ansible.builtin.blockinfile:
    path: /etc/network/interfaces
    marker: '# {mark} ANSIBLE MANAGED THUNDERBOLT INTERFACES'
    insertbefore: 'source /etc/network/interfaces.d/*'
    block: |
      iface en05 inet manual
      iface en06 inet manual

      auto en05
      iface en05 inet static
          address {{ thunderbolt_p2p_ips[node_id].en05 }}
          mtu 65520

      auto en06
      iface en06 inet static
          address {{ thunderbolt_p2p_ips[node_id].en06 }}
          mtu 65520
  notify:
    - Reload ifconfig
