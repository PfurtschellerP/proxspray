---
- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted

- name: Report pending reboot
  ansible.builtin.debug:
    msg: >-
      Packages were upgraded or CPU microcode installed. If a new kernel or microcode was installed, reboot
      the nodes one at a time (wait for the cluster and Ceph to be healthy in between), e.g. with
      update.yml -e update_force=true -e update_reboot=always.
