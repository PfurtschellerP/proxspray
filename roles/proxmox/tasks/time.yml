---
- name: Set timezone
  community.general.timezone:
    name: "{{ proxmox_timezone }}"
  when: proxmox_timezone | length > 0

- name: Configure NTP servers
  ansible.builtin.template:
    src: chrony.sources.j2
    dest: /etc/chrony/sources.d/proxspray.sources
    owner: root
    group: root
    mode: "0644"
  when: proxmox_ntp_servers | length > 0
  notify: Restart chrony

- name: Disable the default NTP pool when NTP servers are configured
  ansible.builtin.replace:
    path: /etc/chrony/chrony.conf
    regexp: '^(pool\s.*)$'
    replace: '#\1 # disabled by proxspray'
  when: proxmox_ntp_servers | length > 0
  notify: Restart chrony

- name: Remove NTP servers
  ansible.builtin.file:
    path: /etc/chrony/sources.d/proxspray.sources
    state: absent
  when: proxmox_ntp_servers | length == 0
  notify: Restart chrony

- name: Re-enable the default NTP pool when no NTP servers are configured
  ansible.builtin.replace:
    path: /etc/chrony/chrony.conf
    regexp: '^#(pool\s.*) # disabled by proxspray$'
    replace: '\1'
  when: proxmox_ntp_servers | length == 0
  notify: Restart chrony

# Orphan mode: while NTP servers are reachable, the nodes follow them; when
# none is, the peers agree on a common time among themselves.
- name: Configure the other nodes as NTP peers
  ansible.builtin.template:
    src: "{{ proxmox_chrony_file.src }}"
    dest: "{{ proxmox_chrony_file.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: chrony-peers.sources.j2
      dest: /etc/chrony/sources.d/proxspray-peers.sources
    - src: chrony-peers.conf.j2
      dest: /etc/chrony/conf.d/proxspray-peers.conf
  loop_control:
    loop_var: proxmox_chrony_file
    label: "{{ proxmox_chrony_file.dest }}"
  when:
    - proxmox_ntp_peers | bool
    - proxmox_peer_ips | length > 0
  notify: Restart chrony

- name: Remove the NTP peers
  ansible.builtin.file:
    path: "{{ proxmox_chrony_file }}"
    state: absent
  loop:
    - /etc/chrony/sources.d/proxspray-peers.sources
    - /etc/chrony/conf.d/proxspray-peers.conf
  loop_control:
    loop_var: proxmox_chrony_file
  when: not proxmox_ntp_peers | bool or proxmox_peer_ips | length == 0
  notify: Restart chrony

- name: Enable and start chrony
  ansible.builtin.systemd_service:
    name: chrony
    enabled: true
    state: started
