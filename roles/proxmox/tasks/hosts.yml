---
# The node's own entry is written by the Proxmox VE installer and is left
# alone; renaming a node or changing its IP needs manual steps anyway.
- name: Add the other nodes to /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} PROXSPRAY MANAGED NODES"
    block: |
      {% for host in groups['all'] | reject('eq', inventory_hostname) | sort %}
      {%   set facts = hostvars[host].ansible_facts %}
      {%   set ip = hostvars[host].proxmox_node_ip | default(hostvars[host].node_ip) | default(facts.default_ipv4.address) %}
      {{ ip }} {{ [facts.fqdn, facts.hostname] | unique | join(' ') }}
      {% endfor %}
  when: proxmox_manage_hosts | bool

- name: Resolve this node's hostname
  ansible.builtin.getent:
    database: ahosts
    key: "{{ ansible_facts.hostname }}"
    fail_key: false

# pve-cluster and corosync use the address the node name resolves to.
- name: Assert that the hostname resolves to the node IP
  vars:
    proxmox_resolved: "{{ (ansible_facts.getent_ahosts | default({})).keys() | list }}"
  ansible.builtin.assert:
    that:
      - proxmox_node_ip in proxmox_resolved
      - proxmox_resolved | select('match', '^(127\.|::1$)') | list | length == 0
    fail_msg: >-
      '{{ ansible_facts.hostname }}' resolves to {{ proxmox_resolved | join(', ') or 'nothing' }},
      but Proxmox VE needs it to resolve to {{ proxmox_node_ip }} only (no loopback address).
      Fix the node's own line in /etc/hosts, e.g. "{{ proxmox_node_ip }} {{ ansible_facts.fqdn }} {{ ansible_facts.hostname }}".
    quiet: true
