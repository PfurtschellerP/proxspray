---
- name: Boot from the stick once
  ansible.builtin.command:
    argv:
      - efibootmgr
      - --bootnext
      - "{{ reinstall_boot_entry }}"
  changed_when: true
  when: not ansible_check_mode

# The installer has no SSH server, so the node answers again only once the
# new system is up. It keeps its SSH host keys (install_media first-boot hook)
# and root's authorized keys come from the answer file.
- name: Reboot into the installer and wait for the new system
  ansible.builtin.reboot:
    msg: Reinstalling Proxmox VE (proxspray)
    reboot_timeout: "{{ reinstall_timeout | int }}"
  when: not ansible_check_mode
