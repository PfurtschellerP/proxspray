---
- name: Validate ACME configuration
  ansible.builtin.assert:
    that:
      - certificates_acme_email is match('^[^@\s]+@[^@\s]+$')
      - certificates_acme_account is match('^[A-Za-z0-9_.-]+$')
      - certificates_acme_directory is match('^https://')
      - certificates_acme_plugins is sequence and certificates_acme_plugins is not string
      - certificates_acme_plugins | map(attribute='id', default='') | select('match', '^[A-Za-z0-9_.-]+$') | list | length == certificates_acme_plugins | length
      - certificates_acme_plugins | map(attribute='id') | unique | list | length == certificates_acme_plugins | length
      - certificates_acme_plugins | map(attribute='api', default='') | select | list | length == certificates_acme_plugins | length
      - certificates_acme_plugins | map(attribute='data', default='') | select('mapping') | list | length == certificates_acme_plugins | length
      - certificates_acme_domains is sequence and certificates_acme_domains is not string
      - certificates_acme_domains | length >= 1
      - certificates_acme_domains | length <= 5
      - certificates_acme_domains | map(attribute='domain', default='') | select | list | length == certificates_acme_domains | length
      - >-
        certificates_acme_domains | map(attribute='plugin', default='') | select
        | difference(certificates_acme_plugins | map(attribute='id')) | length == 0
    fail_msg: >-
      Invalid ACME configuration: certificates_acme_email must be set, every plugin needs a unique id,
      an api and data (a dict), and certificates_acme_domains must list 1-5 entries with a domain whose
      plugin (if any) is defined in certificates_acme_plugins.
    quiet: true

# The account and plugins live in the cluster filesystem and are configured
# once; with several standalone nodes each would need its own.
- name: Check that the nodes form a cluster
  ansible.builtin.stat:
    path: /etc/pve/corosync.conf
  register: certificates_corosync

- name: Assert that the nodes form a cluster
  ansible.builtin.assert:
    that: ansible_play_hosts | length == 1 or certificates_corosync.stat.exists
    fail_msg: ACME mode configures one account and plugin set for the cluster; create the cluster first.
    quiet: true

# Required by the community.proxmox modules.
- name: Install proxmoxer
  ansible.builtin.apt:
    name: python3-proxmoxer
    state: present

- name: Configure the ACME account and plugins
  ansible.builtin.import_tasks: acme_cluster.yml

# The module orders a certificate when the node's ACME settings change or no
# certificate exists. Replacing an existing certificate needs force, which is
# only set when that certificate is expiring or misses a domain, so that runs
# stay idempotent. Proxmox VE renews ACME certificates itself (pve-daily-update).
- name: Check whether the current certificate must be replaced
  vars:
    certificates_names: >-
      {{ certificates_san['pveproxy-ssl.pem'] | default([]) | map('regex_replace', '^(DNS|IP Address|IP):', '') | list }}
  ansible.builtin.set_fact:
    certificates_force: >-
      {{ 'pveproxy-ssl.pem' in certificates_san
         and (certificates_notafter['pveproxy-ssl.pem'] | int < certificates_min_notafter | int
              or certificates_acme_domains | map(attribute='domain') | difference(certificates_names) | length > 0) }}

- name: Order the ACME certificate
  community.proxmox.proxmox_acme_certificate:
    node_name: "{{ certificates_node }}"
    account: "{{ certificates_acme_account }}"
    domains: >-
      {{ certificates_acme_domains | map('dict2items') | map('selectattr', 'value') | map('items2dict') | list }}
    force: "{{ certificates_force | bool }}"
  throttle: 1
