---
- name: Read the Ceph memory settings
  ansible.builtin.command:
    argv: [ceph, config, get, "{{ ceph_setting.who }}", "{{ ceph_setting.name }}"]
  loop: "{{ ceph_settings }}"
  loop_control:
    loop_var: ceph_setting
    label: "{{ ceph_setting.who }} {{ ceph_setting.name }}"
  register: ceph_settings_current
  changed_when: false
  check_mode: false
  run_once: true
  when: not ansible_check_mode or ceph_conf_stat.stat.exists

- name: Set the Ceph memory settings
  ansible.builtin.command:
    argv:
      - ceph
      - config
      - set
      - "{{ ceph_setting_current.ceph_setting.who }}"
      - "{{ ceph_setting_current.ceph_setting.name }}"
      - "{{ ceph_setting_current.ceph_setting.value }}"
  loop: "{{ ceph_settings_current.results | default([]) | rejectattr('skipped', 'defined') }}"
  loop_control:
    loop_var: ceph_setting_current
    label: "{{ ceph_setting_current.ceph_setting.who }} {{ ceph_setting_current.ceph_setting.name }}"
  changed_when: true
  run_once: true
  when: ceph_setting_current.stdout | trim != ceph_setting_current.ceph_setting.value
