---
- name: Create the ISO cache directory
  ansible.builtin.file:
    path: "{{ install_media_cache_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true

- name: Download the Proxmox VE ISO
  ansible.builtin.get_url:
    url: "{{ install_media_iso_url }}"
    dest: "{{ install_media_iso_source }}"
    checksum: "{{ install_media_iso_checksum }}"
    mode: "0644"
  delegate_to: localhost
  run_once: true

- name: Create the media directories
  ansible.builtin.file:
    path: "{{ install_media_workdir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
