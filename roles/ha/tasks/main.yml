---
- name: Validate HA settings
  ansible.builtin.import_tasks: validate.yml

- name: Configure the HA shutdown policy
  ansible.builtin.import_tasks: options.yml

- name: Configure HA resources and rules
  ansible.builtin.import_tasks: resources.yml

- name: Verify HA
  ansible.builtin.import_tasks: verify.yml
  when:
    - ha_verify | bool
    - not ansible_check_mode
