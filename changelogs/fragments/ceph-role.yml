---
major_changes:
  - ceph - new role for a hyper-converged Ceph cluster managed by Proxmox VE on the Thunderbolt fabric. It installs the packages of ``ceph_release``, creates a monitor, manager and metadata server on every node and OSDs on every empty non-USB disk (``ceph_osd_devices`` is ``auto``, optionally filtered by ``ceph_osd_model``, or an explicit list), an RBD pool and storage for VM disks (3 replicas, ``min_size`` 2) and a CephFS whose media directory is stored in an erasure-coded 2+1 pool with overwrites and, on Tentacle, FastEC. OSD and metadata server memory are configurable for small nodes, and the role waits for ``HEALTH_OK`` with all OSDs up and all PGs ``active+clean``. ``reinstall`` removes a reinstalled node's monitor, OSDs, CRUSH host and daemon keys from the remaining Ceph cluster, and refuses to reinstall while Ceph is not fully redundant or without ``install_media_wipe_disks``.
