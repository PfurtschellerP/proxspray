---
major_changes:
  - install_media - new role and ``install_media.yml`` playbook that build one unattended Proxmox VE installer ISO per node on the controller with ``proxmox-auto-install-assistant``. The answer file comes from the inventory (FQDN, static address on the interface selected by ``install_media_interface_filter`` (e.g. the port name for all nodes, or ``node_mac`` per host), gateway, DNS, target disks, filesystem, root password hash, root SSH keys, keyboard, country, timezone, interface name pinning). The nodes' SSH host keys are taken from the running nodes or generated, stored in ``<inventory>/credentials/``, restored by a first-boot hook and added to the controller's ``known_hosts``. With ``install_media_wipe_disks`` the first-boot hook also wipes all other disks except USB devices, found by what the new system uses rather than by name. ISOs are only rebuilt when their inputs change.
