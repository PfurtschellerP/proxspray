---
# The roles look at other nodes (hosts file, cluster join, node IDs), so facts
# of every node are needed even when the run is restricted with --limit.
- name: Gather facts
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Gather facts of all nodes
      ansible.builtin.setup:
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all'] }}"
      run_once: true
      tags: always
